name: ClubSync CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-verify:
    name: Build & Verify Codebase
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Client Dependencies
        run: npm ci

      - name: Build Vite Frontend Production Bundle
        run: npm run build

      - name: Install Server Dependencies
        run: |
          cd server
          npm ci

      - name: Verify Backend Syntax & Startup Check
        run: |
          node -c server/index.js
          node -c server/routes/*.js
